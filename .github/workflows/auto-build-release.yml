name: Release

# Tags, releases and publishes to npm when the version in the Unity package's package.json
# changes on main. The tag check makes a re-run of the same version a no-op, so pushing an
# unrelated commit to main does not republish.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  # Required for npm provenance, which records in the registry which workflow and commit
  # produced the tarball.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: package-version
        run: |
          VERSION=$(node -p "require('./jp.shiranui-isuzu.unity-mcp/package.json').version")
          TS_VERSION=$(node -p "require('./unity-mcp-ts/package.json').version")

          # The Editor and the server speak one protocol. Releasing them at different
          # versions is the failure this whole release exists to design out, so it stops here.
          if [ "$VERSION" != "$TS_VERSION" ]; then
            echo "Unity package is $VERSION but the npm package is $TS_VERSION; they must match."
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing $VERSION"

      - name: Check tag
        id: check-tag
        run: |
          TAG="v${{ steps.package-version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; nothing to release."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.check-tag.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: unity-mcp-ts/package-lock.json

      - name: Install
        if: steps.check-tag.outputs.exists != 'true'
        working-directory: unity-mcp-ts
        run: npm ci

      # A release that fails its own tests is worse than a late one. CI covers pull requests;
      # this covers the path that actually publishes.
      - name: Verify
        if: steps.check-tag.outputs.exists != 'true'
        working-directory: unity-mcp-ts
        run: |
          npx tsc --noEmit
          npm run lint
          npm test
          npm run build

      - name: Create tag
        if: steps.check-tag.outputs.exists != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag "v${{ steps.package-version.outputs.version }}"
          git push origin "v${{ steps.package-version.outputs.version }}"

      - name: Create release
        if: steps.check-tag.outputs.exists != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          name: Release v${{ steps.package-version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishing is separate from the release so a registry outage does not leave the tag
      # uncreated, and so the "already published" check can be explicit rather than relying on
      # npm's error text.
      - name: Already on npm?
        id: npm-check
        if: steps.check-tag.outputs.exists != 'true'
        working-directory: unity-mcp-ts
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=${{ steps.package-version.outputs.version }}
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published."
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.check-tag.outputs.exists != 'true' && steps.npm-check.outputs.published != 'true'
        working-directory: unity-mcp-ts
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        if: steps.check-tag.outputs.exists != 'true'
        run: |
          VERSION=${{ steps.package-version.outputs.version }}
          NAME=$(node -p "require('./unity-mcp-ts/package.json').name")
          {
            echo "## Released v$VERSION"
            echo ""
            echo "- Unity package: \`https://github.com/${{ github.repository }}.git?path=jp.shiranui-isuzu.unity-mcp#v$VERSION\`"
            if [ "${{ steps.npm-check.outputs.published }}" = "true" ]; then
              echo "- npm: already published, skipped"
            else
              echo "- npm: \`npm install $NAME@$VERSION\`"
            fi
          } >> $GITHUB_STEP_SUMMARY
